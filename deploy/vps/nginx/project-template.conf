# Template for adding another project (with its OWN domain) to this VPS
# 1. Copy this file and rename it to your project
# 2. Update server_name to your real domain (e.g., otherproject.com)
# 3. Update root path and proxy port
# 4. Symlink it into sites-enabled
# 5. Run: sudo certbot --nginx -d yourproject.com -d www.yourproject.com

server {
    listen 80;
    server_name yourproject.com www.yourproject.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourproject.com www.yourproject.com;

    ssl_certificate /etc/letsencrypt/live/yourproject.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourproject.com/privkey.pem;

    access_log /var/log/nginx/yourproject.access.log;
    error_log /var/log/nginx/yourproject.error.log;

    # For static sites (React/Vite/Next.js export)
    location / {
        root /opt/projects/yourproject/dist;
        try_files $uri $uri/ /index.html;
    }

    # For API/backend proxy (update port to match your project's docker-compose)
    location /api/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
