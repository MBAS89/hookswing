# HookSwing Nginx Site Configuration
# Place this in /etc/nginx/sites-available/hookswing
# Then symlink: ln -s /etc/nginx/sites-available/hookswing /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name hookswing.com www.hookswing.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hookswing.com www.hookswing.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/hookswing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookswing.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /var/log/nginx/hookswing.access.log;
    error_log /var/log/nginx/hookswing.error.log;

    # Frontend — static files built from apps/web/dist
    location / {
        root /opt/projects/hookswing/apps/web/dist;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Webhook catch endpoint
    location /hook/ {
        proxy_pass http://127.0.0.1:3001/hook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:3001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Env Admin Panel (must be BEFORE the SPA catch-all)
    # ^~ ensures this takes precedence over the React router
    location ^~ /admin/env {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
