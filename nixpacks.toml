aptPkgs = [
  "libnss3",
  "libatk-bridge2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libgtk-3-0",
  "libgdk-pixbuf2.0-0"
]
